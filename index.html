<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de tabuada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gerador de tabuada</h1>

    <label for="numeroInput">Digite um número: </label>
    <input type="number" id ="numero-Input" placeholder="Ex.: 5">
    <button id="btn-gerar">Gerar tabuada</button>

    <div id= "resultado-aqui">
        <!--a tabuada será gerada aqui.-->
        <!-- Só mostrará conteúdo quando o script.js gerar a tabuada. -->
    
        <p>tabuada será exibida aqui.</p>
    </div>


    <!-- O comando abaixo irá chamar o arquivo JS. -->
    <script src="script.js"></script>
</body>
</html>
